name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  zsh-syntax-validation:
    name: Zsh Syntax Validation
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Validate Zsh syntax
        run: |
          echo "==> Checking Zsh file syntax..."
          find . -type f \( -name "*.zsh" -o -name ".zshrc" \) ! -path "*/.git/*" | while read -r file; do
            zsh -n "$file" || exit 1
          done
          echo "==> All Zsh scripts passed syntax check!"

  brewfile-syntax-validation:
    name: Brewfile Syntax Validation
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Validate Brewfile syntax
        run: |
          echo "==> Checking Brewfiles..."
          find . -type f -name "Brewfile" ! -path "*/.git/*" | while read -r brewfile; do
            echo "Checking $brewfile..."
            brew bundle list --all --file="$brewfile"
          done

  symlink-script-run:
    name: Symlink Script Run
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Test symlink script
        run: |
          chmod +x create_symlinks.zsh
          TEMP_HOME=$(mktemp -d)
          DOTFILES=$(pwd) HOME=$TEMP_HOME ./create_symlinks.zsh

  brewfiles-script-run:
    name: Brewfiles Script Run
    needs: [ brewfile-syntax-validation ]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Formulae
        run: |
          chmod +x brew_install_formulae.zsh
          TEMP_HOME=$(mktemp -d)
          DOTFILES=$(pwd) HOME=$TEMP_HOME ./brew_install_formulae.zsh